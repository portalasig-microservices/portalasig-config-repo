spring:
  jpa:
    hibernate.ddl-auto: none
    open-in-view: true
  application:
    flyway:
      enabled: true

management:
  endpoints.web.exposure.include: '*'
  endpoint.health.show.details: always
  metrics.export.prometheus.enabled: true

---
spring:
  config.activate.on-profile: local
  security:
    oauth2:
      client:
        registration:
          portalasig_engine:
            client-id: portalasig_engine
            client-secret: '{cipher}3fdc092d7bd28cc341871599df348b32408c64aa078c3ef86486c16d2e093072'
            authorization-grant-type: client_credentials
          portalasig_client:
            client-id: portalasig_client
            client-secret: '{cipher}3fdc092d7bd28cc341871599df348b32408c64aa078c3ef86486c16d2e093072'
            authorization-grant-type: password,client_credentials
            token-uri: ${portalasig.services.uaa}/oauth/token
            scope: openid,profile,email,phone,address
        provider:
          portalasig_engine:
            token-uri: ${portalasig.services.uaa}/oauth2/token
          portalasig_client:
            token-uri: ${portalasig.services.uaa}/oauth2/token
            authorization-uri: ${portalasig.services.uaa}/oauth2/authorize

# URLs unificadas detrás del API Gateway (Nginx local)
portalasig:
  services:
    uaa: http://ms-uaa:5860/portalasig/uaa
    site: http://ms-site:5861/portalasig/site
    notify: http://ms-notify:5862/portalasig/notify
    frontend: http://localhost:8080

  security:
    auth-server-url: ${portalasig.services.uaa}
    oauth2:
      authorization-server:
        jwt:
          issuer-uri: http://localhost:5860/portalasig/uaa

portalasig.uaa.ms:
  v1.url: ${portalasig.services.uaa}/v1
  url: ${portalasig.services.uaa}
portalasig.notify.ms:
  v1.url: ${portalasig.services.notify}/v1
  url: ${portalasig.services.notify}
portalasig.fe:
  url: ${portalasig.services.frontend}
