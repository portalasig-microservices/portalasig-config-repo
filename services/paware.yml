server:
  port: 8080

spring:
  application.name: paware
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql-paware:3306/paware
    username: ${MYSQL_PAWARE_USER:paware}
    password: ${MYSQL_PAWARE_PASSWORD:paware}
  flyway:
    enabled: true
    user: ${MYSQL_PAWARE_USER:paware}
    password: ${MYSQL_PAWARE_PASSWORD:paware}
    schemas: paware
    locations: classpath:db/migration
    url: jdbc:mysql://mysql-paware:3306/paware

portalasig:
  security:
    jwk-set-uri: http://ms-uaa:5860/portalasig/uaa/oauth2/jwks

paware:
  http:
    proxy:
      host: 172.17.0.1
      port: 3128
  mape:
    enabled: true
    cron: "0 */5 * * * *"
  observability:
    services:
      - name: ms-uaa
        health-url: http://ms-uaa:5860/portalasig/uaa/actuator/health
      - name: ms-site
        health-url: http://ms-site:5861/portalasig/site/actuator/health
      - name: ms-notify
        health-url: http://ms-notify:5862/portalasig/notify/actuator/health
    prometheus-base-url: ${PAWARE_PROMETHEUS_BASE_URL:http://prometheus:9090}
    prometheus-query: up
    loki-base-url: ${PAWARE_LOKI_BASE_URL:http://loki:3100}
    loki-query: '{container_name=~"portalasig-ms-uaa|portalasig-ms-site|portalasig-ms-notify"} |= "ERROR"'
    loki-limit: 30
    loki-window-minutes: 15
  ai:
    default-provider: openai
    session:
      enabled: true
      max-messages: 12
      ttl-minutes: 30
    providers:
      gemini:
        api-key: "{cipher}cf3317c454308d335eb902b06e4d5c10885e0e41e9fa0534b69fbcf643cb850faff008e742499c097ca88632cd2f29e4f92c0c63d8a7a6a166e17d1b7668e353"
        model: gemini-1.5-pro
      openai:
        api-key: "{cipher}"
        model: gpt-4o-mini
  notification:
    enabled: true
        admin-emails:
      - frankponte95.com
