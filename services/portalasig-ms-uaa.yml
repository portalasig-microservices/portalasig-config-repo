  port: 5860

spring:
  application.name: portalasig-ms-uaa
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql-uaa:3306/patest
    username: root
    password: '{cipher}3fdc092d7bd28cc341871599df348b32408c64aa078c3ef86486c16d2e093072'
    hikari:
      initialization-fail-timeout: -1
  flyway:
    user: root
    password: '{cipher}3fdc092d7bd28cc341871599df348b32408c64aa078c3ef86486c16d2e093072'
    schemas: patest
    locations: classpath:db/migration
    url: jdbc:mysql://localhost:11110/
